# Home Screen widgets. They need an App Group, which requires a paid Apple Developer account,
# so they are opt-in: generate the project with `COIL_WIDGETS=true xcodegen`.
# See docs/WIDGETS.md.
targets:
  Coil:
    sources:
      # Debug-only: widget views compiled into the app for WidgetGalleryRenderer.
      - Widgets/WidgetData.swift
      - Widgets/HabitWidget.swift
      - Widgets/HabitsListWidget.swift
      - Widgets/HabitChartWidget.swift
      - Widgets/MoreWidgets.swift
      - Widgets/WidgetGalleryRenderer.swift
    entitlements:
      path: Coil/Coil.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.maxouni.coil
    dependencies:
      - target: CoilWidgets

  CoilWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - WidgetGalleryRenderer.swift
      - Coil/Domain
      - Coil/Model
      - path: Coil/Support
        excludes:
          - UndoCenter.swift
      - Coil/Services/HealthSync.swift
      - Coil/Services/TimerService.swift
      - Coil/Services/ReminderScheduler.swift
      - Coil/Intents
      - Coil/Views/Components/ScoreRing.swift
      - Coil/Views/Components/CheckmarkSymbol.swift
      - Coil/Resources/Localizable.xcstrings
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Coil
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/CoilWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.maxouni.coil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxouni.coil.widgets
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
