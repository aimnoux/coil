name: Coil

include:
  - path: widgets.yml
    enable: ${COIL_WIDGETS}
  - path: icloud.yml
    enable: ${COIL_ICLOUD}
  - path: health.yml
    enable: ${COIL_HEALTH}

options:
  bundleIdPrefix: com.maxouni
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Coil:
    type: application
    platform: iOS
    sources:
      - Coil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxouni.coil
        PRODUCT_NAME: Coil
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Coil
        INFOPLIST_KEY_CFBundleAllowMixedLocalizations: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Show the Documents folder (automatic backups) in the Files app.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  CoilTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CoilTests
    dependencies:
      - target: Coil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxouni.coil.tests
        GENERATE_INFOPLIST_FILE: YES

  CoilUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CoilUITests
    dependencies:
      - target: Coil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxouni.coil.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Coil
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  Coil:
    build:
      targets:
        Coil: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CoilTests
        - CoilUITests
